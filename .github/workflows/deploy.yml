name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      # 把构建环境写进 job summary，便于排查（无需登录即可通过 API 读取）
      - name: Environment info
        run: |
          {
            echo "### 构建环境"
            echo ""
            echo "- node: \`$(node -v)\`"
            echo "- pnpm: \`$(pnpm -v)\`"
            echo ""
            echo "<details><summary>.npmrc</summary>"
            echo ""
            echo '```'
            cat .npmrc 2>/dev/null || echo "(无)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>pnpm-workspace.yaml</summary>"
            echo ""
            echo '```'
            cat pnpm-workspace.yaml 2>/dev/null || echo "(无)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          set +e
          pnpm install --frozen-lockfile --reporter=append-only > /tmp/install.log 2>&1
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            {
              echo "### pnpm install failed (exit $CODE)"
              echo ""
              echo '```'
              tail -c 6000 /tmp/install.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "--- install.log head ---"
            head -c 900 /tmp/install.log
            echo
            echo "--- install.log tail ---"
            tail -60 /tmp/install.log
            # 以 annotation 形式输出（公开仓库可通过 API 匿名读取）
            HEAD_MSG=$(head -c 700 /tmp/install.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            TAIL_MSG=$(tail -c 1500 /tmp/install.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=install-log-head::$HEAD_MSG"
            echo "::error title=install-log-tail::$TAIL_MSG"
            exit 1
          fi
          tail -20 /tmp/install.log

      - name: Build site
        run: pnpm run build
        env:
          # 项目仓库部署在 https://<user>.github.io/<repo>/ 子路径下
          GH_PAGES_BASE: /${{ github.event.repository.name }}

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
